<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Reakční čas – vizuální podnět</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #2b2b2b;
      color: #ffffff;
      overscroll-behavior: none; /* méně gumování/posunů na mobilech */
    }

    #app {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition: none;
      padding: 1rem;

      /* MAX citlivost na dotyk */
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    h1 {
      font-size: clamp(1.6rem, 2.2vw, 2.2rem);
      margin-bottom: 1rem;
    }

    #message {
      font-size: clamp(1.2rem, 1.8vw, 1.8rem);
      margin-bottom: 1.5rem;
    }

    #result {
      font-size: clamp(1.4rem, 2.2vw, 2.2rem);
      font-weight: bold;
      margin-top: 0.5rem;
    }

    #startBtn {
      font-size: clamp(1.1rem, 1.6vw, 1.6rem);
      padding: 0.8rem 1.6rem;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      margin-top: 1.5rem;
      background: #ffffff;
      color: #222;
      font-weight: 600;
      box-shadow: 0 0.4rem 1rem rgba(0, 0, 0, 0.4);
      transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.1s ease;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    #startBtn:active {
      transform: translateY(2px);
      box-shadow: 0 0.2rem 0.5rem rgba(0, 0, 0, 0.6);
      background-color: #e4e4e4;
    }

    #downloadHtmlBtn {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      right: max(10px, env(safe-area-inset-right));
      z-index: 10;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 999px;
      padding: .45rem .7rem;
      background: rgba(25,25,25,.55);
      color: rgba(255,255,255,.9);
      font: 600 .78rem/1 system-ui, sans-serif;
      cursor: pointer;
      backdrop-filter: blur(5px);
      -webkit-tap-highlight-color: transparent;
    }

    #downloadHtmlBtn:hover { background: rgba(25,25,25,.75); }

    .hint {
      margin-top: 1rem;
      font-size: 0.95rem;
      opacity: 0.9;
    }
  
    #stats {
      width: min(100%, 520px);
      display: grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: .45rem;
      margin-top: 1.4rem;
      font-variant-numeric: tabular-nums;
    }
    #stats > div {
      border: 1px solid rgba(255,255,255,.24);
      background: rgba(0,0,0,.22);
      border-radius: 12px;
      padding: .65rem .25rem;
      min-width: 0;
    }
    #stats span { display: block; font-size: clamp(.69rem, 2.7vw, .9rem); }
    #stats strong { display: block; font-size: clamp(1.05rem, 4.4vw, 1.6rem); margin-top: .25rem; white-space: nowrap; }
    #resetStatsBtn {
      margin-top: .75rem; padding: .6rem 1rem; border-radius: 10px;
      border: 1px solid rgba(255,255,255,.45); background: rgba(0,0,0,.25);
      color: white; font: inherit; cursor: pointer; touch-action: manipulation;
    }
    #app { min-height: 100%; height: auto; padding-top: 3rem; padding-bottom: 1rem; }
    @media(max-height: 450px) { #app { padding-top: 2.5rem; } #stats { margin-top: .6rem; } h1 { margin-bottom: .4rem; } #message { margin-bottom: .5rem; } }

  #stats span{min-height:2.4em;display:flex;align-items:center;justify-content:center;line-height:1.15} #stats > div:nth-child(4) strong,#stats > div:nth-child(6) strong{color:#b8f5ce} #stats > div:nth-child(5) strong{color:#ffb9b2}
  </style>
</head>
<body>
  <!-- bernio-download-html -->
  <button id="downloadHtmlBtn" type="button" title="Stáhnout tuto aplikaci jako HTML">⬇️ Stáhnout HTML</button>

  <div id="app">
    <h1>Měření reakčního času</h1>
    <div id="message">
      Klikni na <strong>Spustit test</strong>.<br>
      Až se obrazovka zbarví <strong style="color:#ff4444;">červeně</strong>, co nejrychleji se jí dotkni.
    </div>
    <div id="result"></div>
    <button id="startBtn" type="button">Spustit test</button>
    <div id="stats" aria-label="Statistiky pokusů">
      <div><span>Průměrná doba</span><strong id="avgTime">—</strong></div>
      <div><span>Nejrychlejší doba</span><strong id="bestTime">—</strong></div>
      <div><span>Počet pokusů</span><strong id="attemptCount">0</strong></div>
      <div><span>Správně</span><strong id="correctCount">0</strong></div>
      <div><span>Chybně (předčasně)</span><strong id="wrongCount">0</strong></div>
      <div><span>Správně za sebou</span><strong id="streakCount">0</strong></div>
    </div>
    <button id="resetStatsBtn" type="button">Vynulovat hodnoty</button>
  </div>

  <script>
    const app = document.getElementById('app');
    const messageEl = document.getElementById('message');
    const resultEl = document.getElementById('result');
    const startBtn = document.getElementById('startBtn');
    const downloadHtmlBtn = document.getElementById('downloadHtmlBtn');

    // Stav může být: "idle", "waiting", "ready", "done"
    let state = "idle";
    let timeoutId = null;
    let startTime = null;
    let stimulusFrame = null;
    // Use the timestamp of the actual pointer-down event, not the time at
    // which the main thread eventually handles it.
    function inputTime(event) {
      const now = performance.now();
      let t = event.timeStamp;
      if (t > 1e12) t -= performance.timeOrigin;
      return Number.isFinite(t) && t > 0 && t <= now + 1 ? Math.min(t, now) : now;
    }

    // Zámek proti dvojímu vyhodnocení (pointerdown + pointerup apod.)
    let reactedThisRound = false;
    const resetStatsBtn = document.getElementById('resetStatsBtn');
    const initialMessage = messageEl.innerHTML;
    const times = [];
    let wrongCount = 0;
    let streak = 0;
    let revealTimer = null;
    function renderStats() {
      const count = times.length;
      const format = seconds => seconds.toFixed(3).replace('.', ',') + ' s';
      document.getElementById('attemptCount').textContent = count + wrongCount;
      document.getElementById('correctCount').textContent = count;
      document.getElementById('wrongCount').textContent = wrongCount;
      document.getElementById('streakCount').textContent = streak;
      document.getElementById('avgTime').textContent = count ? format(times.reduce((sum,t)=>sum+t,0)/count) : '—';
      document.getElementById('bestTime').textContent = count ? format(times.reduce((best,t)=>Math.min(best,t),Infinity)) : '—';
    }
    function clearRevealTimer() {
      if (revealTimer !== null) { clearTimeout(revealTimer); revealTimer = null; }
    }
    function resetStats() {
      clearPendingTimeout();
      clearRevealTimer();
      state = 'idle';
      reactedThisRound = false;
      startTime = null;
      times.length = 0;
      wrongCount = 0;
      streak = 0;
      resetVisual();
      app.style.backgroundColor = '#2b2b2b';
      
      messageEl.innerHTML = initialMessage;
      startBtn.textContent = 'Spustit test';
      startBtn.style.display = 'inline-block';
      renderStats();
    }
    resetStatsBtn.addEventListener('pointerdown', e => e.stopPropagation());
    resetStatsBtn.addEventListener('click', e => { e.stopPropagation(); resetStats(); });
    renderStats();

    function resetVisual() {
      // Základní vzhled – neutrální pozadí
      app.style.backgroundColor = "#2b2b2b";
      resultEl.textContent = "";
    }

    function clearPendingTimeout() {
      if (stimulusFrame !== null) {
        cancelAnimationFrame(stimulusFrame);
        stimulusFrame = null;
      }
      if (timeoutId !== null) {
        clearTimeout(timeoutId);
        timeoutId = null;
      }
    }

    function startTest() {
      if (state === 'waiting' || state === 'ready') return;
      clearRevealTimer();
      clearPendingTimeout();

      reactedThisRound = false;
      state = "waiting";
      resetVisual();

      messageEl.innerHTML = "Čekej, než se obrazovka zbarví <strong style=\"color:#ff4444;\">červeně</strong>...";
      startBtn.style.display = "none";

      // Pozadí je nyní zelené, žák ví, že čeká
      app.style.backgroundColor = "#2ecc71";

      // Náhodné zpoždění 1–3 s
      const minDelay = 1;    // s
      const maxDelay = 3;   // s
      const delayMs = (minDelay + Math.random() * (maxDelay - minDelay)) * 1000;

      timeoutId = setTimeout(() => {
        timeoutId = null;
        stimulusFrame = requestAnimationFrame(() => {
          stimulusFrame = null;
          if (state !== 'waiting') return;
          app.style.backgroundColor = "#e74c3c";
          messageEl.textContent = "TEĎ! Dotkni se obrazovky co nejrychleji!";
          // The next paint presents the stimulus. Physical panel latency is not measurable here.
          startTime = performance.now();
          state = "ready";
        });
      }, delayMs);
    }

    function handleReaction(event) {
      // aby se touch nezduplikoval / aby se neřešil scroll/zoom
      const pressedAt = inputTime(event);
      event.preventDefault();

      // Ignoruj klik na tlačítko start, ten se řeší zvlášť
      if (event.target.closest('button') || event.button !== 0) return;

      if (reactedThisRound) return;
      reactedThisRound = true;

      if (state === "waiting" || (state === "ready" && pressedAt < startTime)) {
        wrongCount++;
        streak = 0;
        renderStats();
        // Klikl příliš brzy
        clearPendingTimeout();
        state = "idle";
        app.style.backgroundColor = "#2b2b2b";
        messageEl.innerHTML = "Příliš brzy! Obrazovka ještě nebyla červená.";
        resultEl.textContent = "";
        startBtn.textContent = "Zkusit znovu";
        startBtn.style.display = "inline-block";

        // aby šlo hned znovu
        reactedThisRound = false;

      } else if (state === "ready") {
        const endTime = pressedAt;
        const reactionTime = (endTime - startTime) / 1000; // v sekundách

        state = "done";
        app.style.backgroundColor = "#3498db"; // modrá po zachycení

        messageEl.textContent = "Tvůj reakční čas:";
        resultEl.textContent = reactionTime.toFixed(3).replace('.', ',') + " s";
        times.push(reactionTime);
        streak++;
        renderStats();

        // Tlačítko bude skryté...
        startBtn.style.display = "none";
        startBtn.textContent = "Spustit test znovu";

        // ...a ukáže se až po 0,5 s
        revealTimer = setTimeout(() => {
          revealTimer = null;
          if (state === 'done') startBtn.style.display = "inline-block";
        }, 500);

      } else {
        // idle/done – nic
        reactedThisRound = false;
      }
    }

    function downloadCurrentHtml(event) {
      event.preventDefault();
      event.stopPropagation();
      const html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
      const blob = new Blob([html], {type:'text/html;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'reakcni-cas-vizualni.html';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 0);
    }

    downloadHtmlBtn.addEventListener('pointerdown', downloadCurrentHtml, {passive:false});

    // Start: pointerdown je rychlejší než click a nepropadne na app
    startBtn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      startTest();
    }, {passive:false});

    // Měření při stisku, nikoli při uvolnění prstu; jeden platný výsledek na pokus.
    startBtn.addEventListener('click', e => { if (e.detail === 0) startTest(); });
    app.addEventListener('pointerdown', handleReaction, {passive:false});
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && (state === 'waiting' || state === 'ready')) {
        clearPendingTimeout();
        clearRevealTimer();
        
        state = 'idle';
        reactedThisRound = false;
        startTime = null;
        resetVisual();
        messageEl.textContent = 'Měření přerušeno. Zkus to znovu.';
        startBtn.textContent = 'Zkusit znovu';
        startBtn.style.display = 'inline-block';
      }
    });

  </script>
</body>
</html>
